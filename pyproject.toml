[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "anonymous-audio-tracks"
version = "0.1.0"
description = "Anonymous source embeddings and center-time activity trajectories for music-driven LEDs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
# Optional renderer stack owned by the DawDreamer/Surge issue (#3). Empty on purpose:
# this issue must stay free of model/data downloads.
render = []
# Optional feature/training stack owned by the AuT and head issues (#5, #7).
# Entries are added and locked by those issues; never install a GPU stack by default.
ml = [
    "torch>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

# The head/loss tests need torch.  Resolve it from the CPU-only wheel index so a
# plain ``uv sync --extra ml`` never pulls the default CUDA/nvidia stack.  The
# index is explicit and only used for the packages mapped in [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/aat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
