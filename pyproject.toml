[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "anonymous-audio-tracks"
version = "0.1.0"
description = "Anonymous source embeddings and center-time activity trajectories for music-driven LEDs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
# Optional renderer stack owned by the DawDreamer/Surge issue (#3).
# DawDreamer renders deterministic offline audio graphs with built-in
# processors, FAUST and VST3 plugins; it stays an extra so the base install
# never downloads models, data or plugins.
render = [
    "dawdreamer>=0.9,<0.10",
]
# Optional feature/training stack owned by the AuT and head issues (#5, #7).
# Torch is resolved from the explicit CPU-only wheel index below, so
# `uv sync --locked --extra ml` never pulls the CUDA/nvidia stack.  Darwin
# falls back to the default PyPI index because the PyTorch CPU index has no
# macOS arm64 wheels; PyPI torch on macOS is CPU-only anyway.
ml = [
    "torch>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/aat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires the optional render extra (DawDreamer)",
    "ml: requires the optional ml extra (CPU PyTorch)",
]
