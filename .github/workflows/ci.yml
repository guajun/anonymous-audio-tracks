name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linux-cpu-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base install: contract/window/unit suites; DawDreamer integration
          # tests self-skip because the optional render extra is not installed,
          # and ML head/loss tests are deselected (torch is not installed).
          - name: unit
            sync-args: ""
            pytest-args: -m "not integration and not ml"
          # Render extra: real DawDreamer smoke renders (mix/stem additivity,
          # latency, tail decay, reproducibility) from the same lock file.
          - name: render
            sync-args: --extra render
            pytest-args: -m "not ml"
          # ML extra: CPU-only torch from the explicit pytorch-cpu wheel index;
          # real head/loss/matching tests including a CPU overfit experiment.
          - name: ml
            sync-args: --extra ml
            pytest-args: -m ml
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Sync locked environment (no models, no data, no secrets)
        run: uv sync --locked ${{ matrix.sync-args }}
      - name: Verify CPU-only PyTorch (ml job)
        if: matrix.name == 'ml'
        run: |
          uv run --no-sync python - <<'PY'
          import torch
          assert torch.version.cuda is None, f"expected CPU torch, got CUDA {torch.version.cuda}"
          print("torch", torch.__version__, "cuda", torch.version.cuda)
          PY
      - name: Run tests
        run: uv run --no-sync pytest -q -p no:cacheprovider ${{ matrix.pytest-args }}
