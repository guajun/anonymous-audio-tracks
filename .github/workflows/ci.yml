name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linux-cpu-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Sync locked environment (no models, no data, no secrets)
        run: uv sync --locked
      - name: Run contract and windowing tests
        run: uv run --no-sync pytest -q
