name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linux-cpu-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Sync locked environment with the ml extra (CPU torch; no models, no data)
        run: uv sync --locked --extra ml
      - name: Verify the CPU-only ml extra is installed
        run: uv run --no-sync python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__; print(torch.__version__)"
      - name: Run contract, windowing and model-head tests
        run: uv run --no-sync pytest -q
