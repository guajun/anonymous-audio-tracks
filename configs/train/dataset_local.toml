# Real DawDreamer training-data plan for issue #8 (small local corpus).
#
# 8 songs in 3 disjoint asset families (train/val/test): every song belongs to one
# composition; preset_ref/sample_ref are family-scoped voice IDs, and the four train
# songs are linked through shared voices so the index keeps the whole train family in
# one split component.  Nothing is downloaded; every buffer is synthesized by the
# DawDreamer built-ins configured below.  No Surge XT is used (the plugin was not
# installed locally), so this corpus covers self-generated sampler voices only.

[dataset]
name = "local-render-v1"
seed = 20260929
sample_rate = 44100
block_size = 512
ratios = [0.5, 0.25, 0.25]
slots = 8
window_seconds = 2.0

