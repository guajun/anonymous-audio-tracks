# CPU fake-encoder training on the locally rendered DawDreamer corpus (issue #8).
#
# ENGINEERING RUN: the fake encoder proves data -> batch -> head -> loss ->
# checkpoint -> resume -> evaluation wiring.  It is not a real AuT result and
# its metrics say nothing about real model quality.
#
# Reproduce (from the repository root):
#   uv sync --locked --extra ml
#   uv run --no-sync python scripts/train.py train --config configs/train/fake_local.toml

[run]
name = "fake-local"
out_dir = "runs/train/fake-local"
seed = 20260929
device = "cpu"
notes = "fake encoder smoke on real DawDreamer renders; pipeline evidence only"

[encoder]
mode = "fake"
feature_dim = 16
fake_seed = 20260929
batch_windows = 8

[data]
index = "runs/train-index/index.json"
data_root = "runs/train-data"
split = "train"
groups_per_step = 1
centers_per_item = 6
min_center_gap = 5
valid_only = true
activity_threshold = 0.5
verify_digests = true

[head]
slots = 8
d_model = 128
num_heads = 4
dropout = 0.0
time_frequencies = 6
base_frequency_hz = 1.0
ffn_multiplier = 2

[loss]
w_activity = 1.0
w_empty_slots = 0.5
w_positive = 1.0
w_negative = 1.0
identity_activity_threshold = 0.5
negative_margin = 0.25
max_optimal_assignments = 64

[optim]
lr = 3e-3
weight_decay = 0.0
steps = 600
grad_clip_norm = 1.0

[checkpoint]
interval_steps = 100

[eval]
enabled = true
splits = ["train", "val", "test"]
threshold = 0.5
max_songs = 4
baselines = true
