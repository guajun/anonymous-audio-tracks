# Deterministic 20 s smoke sample for issue #3 (no external assets).
#
# Reproduce with:
#   uv sync --locked --extra render
#   uv run --no-sync python scripts/render_sample.py render \
#       --config configs/render/smoke.toml --out runs/render/smoke-0001
#
# Four independently controllable layers: kick, snare, plucked bass and pad.
# Every layer is synthesized locally from sample.seed; nothing is downloaded and
# nothing here is machine-specific.

[render]
sample_id = "smoke-0001"
composition = "comp-smoke-01"
seed = 20260929
sample_rate = 44100
block_size = 512
bpm = 100.0
duration_seconds = 20.0
tail_seconds = 3.0
track_start_seconds = 0.0
notes = "self-generated deterministic smoke sample; 4 anonymous source layers"

# Surge XT is probed only when a plugin path is passed at runtime:
#   --surge-plugin-path "<path to Surge XT.vst3>"
[surge]
probe_duration_seconds = 1.5
note = 60
velocity = 100

[[sources]]
id = "s01"
gain = 0.9
center_note = 36
preset_ref = "aat/sampler/kick-v1"
sample_ref = "aat/generated/kick-v1"
sample = { type = "kick", seed = 11, params = { duration_seconds = 0.6, decay_seconds = 0.35 } }
amp = { attack_ms = 1.0, decay_ms = 0.0, sustain = 1.0, release_ms = 40.0 }
